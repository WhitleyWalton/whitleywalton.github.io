    .gallery {
      display: flex;

      padding: 0 15px;
    }

    .gallery-item {
      position: relative;
      width: calc(25% - 20px);
      height: auto;
      margin: 10px;
      cursor: pointer;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover {
      transform: scale(1.1);
    }

    /* The Modal (background) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    /* Modal content (image) */
    .modal-content {
      position: relative;
      width: 30%;
      height: 80%;
      /* max-width: 90%;
      max-height: 90%;
      */
      border-radius: 5px;
      overflow: hidden;
      animation: zoomIn 0.5s;
    }

    .modal-content-wide {
      position: relative;
      width: 40%;
      height: 80%;
      /* max-width: 90%;
      max-height: 90%;
      */
      border-radius: 5px;
      overflow: hidden;
      animation: zoomIn 0.5s;
    }

    @keyframes zoomIn {
      from {
        transform: scale(0.6);
      }

      to {
        transform: scale(1);
      }
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    /* Close button */
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #ffffff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s;
    }

    /* Caption of modal image */
    .caption {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-size: 24px;
    }

    @media screen and (max-width: 768px) {
      .gallery-item {
        width: calc(50% - 20px);
      }
    }

    @media screen and (max-width: 480px) {

  <script>
    function openModal(modalId, caption) {
      let modal = document.getElementById(modalId);
      modal.style.display = "flex";
      modal.classList.add("show");
      let message = modal.querySelector(".caption");
      message.innerText = caption;
    }

    function closeModal(modalId) {
      let modal = document.getElementById(modalId);
      modal.classList.remove("show");
      setTimeout(function () {
        modal.style.display = "none";
        modal.querySelector(".caption").innerText = "";
      }, 300);
    }
  </script>
