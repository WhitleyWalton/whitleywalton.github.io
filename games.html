<!DOCTYPE html>
<html lang="en">

<head>
  <title>Games</title>

<body style="background-color: rgb(255, 173, 173);">
  <div>
    <h1 class="title">
      Game Design & Development
    </h1>
    <p class="subtitle">
      Various game projects developed solo and on teams.
    </p>
  </div>

<!-- Paragraph Styles Start-->
<style>
  .title {
    font-family: monospace;
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    text-decoration: underline;
  }

  .subtitle {
    font-family: monospace;
    font-size: 22px;
    font-style: italic;
    text-align: center;
    margin-bottom: 6;
  }
</style>
<!-- Start Button Styles-->
<style>
  .games-button {
    background-color: rgb(154, 12, 130);
    color: rgb(255, 255, 255);
    border-color: rgb(239, 63, 201);
    height: 36px;
    width: 100px;
    border-radius: 10px;
    cursor: pointer;
    margin-right: 4px;
    font-weight: bold;
    display: inline-block;

    transition: opacity 0.2s,
      background-color 0.2s, color 0.2s, box-shadow 0.15s;
  }

  .games-button:hover {
    opacity: 0.8;
    box-shadow: 5px 8px 10px rgb(65, 2, 55, 0.4);
  }

  .games-button:active {
    opacity: 0.4;
    background-color: rgb(255, 239, 251);
    color: rgb(154, 12, 130);
  }
</style>
<!-- End Button Styles-->

<!-- Start Buttons-->
<button class="games-button" onclick="document.location='https://whitleywalton.itch.io/'">
  itch.io
</button>
<!-- End Buttons-->
